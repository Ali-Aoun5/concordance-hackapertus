[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "concordance"
version = "0.1.0"
description = "Cross-lingual consistency auditing for Swiss federal law with Apertus"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "matplotlib>=3.8"]

[project.scripts]
concordance = "concordance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
concordance = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
