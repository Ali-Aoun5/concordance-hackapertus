<span class="meta">Differs in: ${(d.languages_at_fault||[]).map(l=>LN[l]).join(", ")||"unclear"} · confidence ${Math.round((d.confidence||0)*100)}%${d.origins?" · found by "+e(d.origins.join(", ")):""}</span></div>

${d.verdict_reason?`<details><summary>Why the checker thinks so</summary><p>${e(d.verdict_reason)}${d.grounded===false?" (Not backed by a quoted passage – check carefully.)":""}</p></details>`:""}
<div class="act">${[["confirmed","Confirm","c"],["dismissed","Dismiss","d"],["expert","Ask an expert","e"]].map(([k,t,c])=>`<button data-d="${k}" aria-pressed="${x===k}">${t} <kbd>${c}</kbd></button>`).join("")}</div></article>`}).join("");
if((r.rejected||[]).length)h+=`<details><summary>${r.rejected.length} possible difference${r.rejected.length>1?"s":""} the checker ruled out</summary>${r.rejected.map(d=>`<p class="meta">${e(lab(d.type))}: ${e(d.explanation||"")}</p>`).join("")}</details>`;
$("art").innerHTML=h+"</div>"}
function render(anim){filt();summ();list();art(anim)}
function cur(){return L[s.a]}
function pulse(i){const c=$("c"+i);if(!c)return;document.querySelectorAll(".card").forEach(x=>x.classList.toggle("cur",x===c));
c.scrollIntoView({behavior:"smooth",block:"center"});c.classList.remove("pulse");void c.offsetWidth;c.classList.add("pulse")}
function go(a,f){const ch=a!==s.a;s.a=a;s.f=f;if(ch){list();art(true)}pulse(f)}
function flat(){const o=[];L.forEach((r,a)=>r.divergences.forEach((_,f)=>o.push([a,f])));return o}
function move(k){const F=flat();if(!F.length)return;let i=F.findIndex(x=>x[0]===s.a&&x[1]===s.f);i=Math.max(0,Math.min(F.length-1,i+k));go(...F[i])}
function decide(v){const r=cur();if(!r)return;const k=key(r,s.f);if(dec[k]===v)delete dec[k];else dec[k]=v;save();summ();list();const y=scrollY;art(false);scrollTo(0,y);pulse(s.f)}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1600)}
function copy(t){try{navigator.clipboard.writeText(t).then(()=>toast("Copied"),fb)}catch(_){fb()}
function fb(){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copied")}catch(_){toast("Copy failed")}a.remove()}}
$("list").onclick=ev=>{const b=ev.target.closest("[data-a]");if(b)go(+b.dataset.a,0)};
$("art").onclick=ev=>{const m=ev.target.closest("mark"),c=ev.target.closest(".card"),b=ev.target.closest("button");
if(m){s.f=+m.dataset.f;pulse(s.f);return}if(c)s.f=+c.dataset.i;
if(b&&b.dataset.d)decide(b.dataset.d);else if(b&&b.dataset.copy!=null){const[i,j]=b.dataset.copy.split(".");copy(sugg(cur().divergences[+i].suggestion)[+j].t)}
else if(c){document.querySelectorAll(".card").forEach(x=>x.classList.toggle("cur",x===c))}};
$("art").onkeydown=ev=>{if((ev.key==="Enter"||ev.key===" ")&&ev.target.tagName==="MARK"){ev.preventDefault();ev.target.click()}};
["q","fs","fd"].forEach(i=>$(i).oninput=()=>{s={a:0,f:0};render(true)});
addEventListener("keydown",ev=>{if(ev.metaKey||ev.ctrlKey||ev.altKey||/INPUT|SELECT|TEXTAREA/.test(ev.target.tagName)||$("rv").hidden)return;
const k=ev.key;if(k==="j")move(1);else if(k==="k")move(-1);else if(k==="c")decide("confirmed");else if(k==="d")decide("dismissed");else if(k==="e")decide("expert")});
function dl(n,t,m){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function rows(){const o=[];ALL.forEach(r=>r.divergences.forEach((d,i)=>o.push({act:r.act_id,article:r.num,type:lab(d.type),severity:d.severity,differs_in:(d.languages_at_fault||[]).join("+"),explanation:d.explanation,suggestion:d.suggestion||"",needs_human:d.verdict==="uncertain"?"yes":"no",decision:dec[key(r,i)]||"undecided"})));return o}
$("xj").onclick=()=>dl("review-decisions.json",JSON.stringify({meta:D.meta,decisions:rows()},null,2),"application/json");
$("xc").onclick=()=>{const R=rows(),H=Object.keys(R[0]||{act:1});dl("review-decisions.csv","\ufeff"+[H.join(",")].concat(R.map(r=>H.map(h=>'"'+String(r[h]).replace(/"/g,'""')+'"').join(","))).join("\r\n"),"text/csv")};
function tab(n){const a=n===1;$("rv").hidden=!a;$("ev").hidden=a;$("t1").setAttribute("aria-selected",a);$("t2").setAttribute("aria-selected",!a);if(!a)evalView()}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);
if(store.how){$("how").hidden=true}$("hx").onclick=()=>{$("how").hidden=true;store.how=1;save()};
$("syn").hidden=!(D.meta&&D.meta.synthetic);
const pc=v=>v==null?"–":Math.round(v*100)+"%";
function chart(items){return`<svg viewBox="0 0 340 ${items.length*30+4}" width="100%" role="img">`+items.map((x,i)=>`<text x="0" y="${i*30+17}" font-size="10.5" fill="currentColor">${e(x.l)}</text><rect x="130" y="${i*30+5}" width="150" height="16" rx="4" fill="var(--line)"/><rect class="bw" x="130" y="${i*30+5}" width="0" data-w="${Math.max(0,x.v*150)}" height="16" rx="4" fill="var(--acc)"/><text x="286" y="${i*30+17}" font-size="11" fill="currentColor">${x.t||pc(x.v)}</text>`).join("")+"</svg>"}
function evalView(){const V=D.eval;if(!V||!V.modes){$("ev").innerHTML='<div class="empty">No evaluation was included with this data.</div>';return}
const M=Object.entries(V.modes),cs=m=>(m.cost||{}).cost_units_8b_equiv,mx=Math.max(1,...M.map(([,m])=>cs(m)||0)),nm=k=>MODE[k]||k,sh=k=>nm(k).split(" (")[0],cc=m=>cs(m)==null?"–":cs(m)===0?"free":Math.round(cs(m)/1000)+"k";
const ty=k=>V.modes[k]?`<div><h3>Found by type: ${e(sh(k).toLowerCase())}</h3>${chart(Object.entries(V.modes[k].per_type||{}).map(([t,x])=>({l:lab(t).replace(/ \(.*\)/,"").replace(" differs","")+" ("+x.n+")",v:x.recall})))}</div>`:"";
$("ev").innerHTML=`<h2>How well does the checker work?</h2><p class="meta">Tested on ${V.n_cases} cases where the right answer is known${D.meta&&D.meta.synthetic?" (invented test text)":""}.</p>
<div style="overflow-x:auto"><table><tr><th>Method</th><th>Real problems found</th><th>Precision</th><th>Recall</th><th>F1</th><th>False alarms</th><th>Right language blamed</th><th>Relative cost</th></tr>`+
M.map(([k,m])=>`<tr><td>${e(nm(k))}</td><td>${m.tp==null?"–":m.tp+" of "+m.n_positive}</td><td>${pc(m.precision)}</td><td>${pc(m.recall)}</td><td>${pc(m.f1)}</td><td>${pc(m.false_positive_rate)}</td><td>${pc(m.attribution_accuracy)}</td><td>${cc(m)}</td></tr>`).join("")+`</table></div>
<div class="charts"><div><h3>Real problems found, by method</h3>${chart(M.map(([k,m])=>({l:sh(k),v:m.recall})))}</div>
<div><h3>Cost (lower is cheaper)</h3>${chart(M.map(([k,m])=>({l:sh(k),v:(cs(m)||0)/mx,t:cc(m)})))}</div>${ty("llm70")}${ty("cascade")}</div>
<div class="note"><b>What these numbers mean.</b> <i>Precision</i>: when the tool flags something, how often it is a real problem. <i>Recall</i>: of all real problems, how many it finds. <i>F1</i> blends the two. <i>False alarms</i>: how often a harmless text is flagged. <i>Right language blamed</i>: how often it names the correct odd-one-out version. <i>Cost</i> is in thousands of units, where one unit is the price of one small-model token.<br><br><b>Read with care.</b> ${V.n_cases<50?"Only "+V.n_cases+" cases were tested, so a single extra miss would visibly move every score. ":""}${D.meta&&D.meta.synthetic?"The errors in the test text were planted on purpose, so real law will likely be harder. ":""}Strong scores here are encouraging, not a guarantee. Nothing is final until a person has decided.</div>`;
requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll(".bw").forEach(r=>r.style.width=r.dataset.w+"px")))}
["q","fs","fd"].forEach(i=>$(i).value="");
render(true);
</script></body></html>
